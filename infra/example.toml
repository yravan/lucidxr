# Copy to ~/.config/lucidxr/infra.toml and choose an actual path on this machine.
[locations]
demos = "~/lucidxr-data/demos"
training_cache = "~/lucidxr-data/training-cache"
training_runs = "~/lucidxr-data/training-runs"

# Fill in values from your MIT allocation and SSH configuration.
# [clusters.engaging]
# host = "engaging"
# user = "YOUR_USERNAME"
# root = "/YOUR_SHARED_STORAGE/lucidxr-runs"
# partition = "mit_normal_gpu"
# account = "YOUR_SLURM_ACCOUNT"
# uv = "/home/YOUR_USERNAME/.local/bin/uv"
# cpus = 4
# memory_gb = 16
# minutes = 20
# concurrency = 2
