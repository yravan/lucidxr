[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "lucidxr"
version = "0.1.0"
description = "Reproducible MuJoCo task scenes for LucidXR"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mujoco>=3.13.0", "numpy>=2.5.3", "lxml>=6.1.3", "scipy>=1.18.1"]

[dependency-groups]
dev = ["pytest>=9.1.1", "build>=1.6.1", "ruff>=0.16.7"]

[tool.setuptools.packages.find]
include = ["lucidxr*"]
exclude = ["*.tests*"]
namespaces = false

[tool.setuptools.package-data]
"lucidxr.sim.xml_schema" = ["**/*.xml", "**/*.yaml", "**/*.json"]
"lucidxr.sim.assets" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["lucidxr/tests"]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["deprecated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
